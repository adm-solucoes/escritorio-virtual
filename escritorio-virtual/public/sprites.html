<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pecas trocadas pelo pacote</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 20px; background: #eceaf6; color: #2c3240;
      font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 19px; }
    .aviso { margin: 0 0 16px; color: #666f80; font-size: 12.5px; max-width: 760px; }
    .grade { display: flex; flex-wrap: wrap; gap: 10px; }
    .cel {
      background: #fff; border-radius: 9px; padding: 8px;
      box-shadow: 0 3px 10px rgba(30,34,48,.09); text-align: center;
    }
    .cel b { display: block; font-size: 11.5px; margin-top: 5px; }
    .cel span { display: block; font-size: 10px; color: #99a0b0; }
    canvas { display: block; image-rendering: pixelated; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Pecas que o pacote ja cobre</h1>
  <p class="aviso">
    Cada quadro passa pelo mesmo caminho que o mapa usa
    (<code>Game.desenharObjeto</code>), com uma grade falsa de 3&times;3 do proprio
    tile &mdash; entao o que aparece aqui e exatamente o que aparece no jogo,
    inclusive as emendas de peca larga.
  </p>
  <div class="grade" id="grade"></div>

  <script src="js/map.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
  <script>
  (function () {
    var M = window.OfficeMap, T = M.TILE, Z = 2;
    var LARG = 4, ALT = 4;   // celulas desenhadas em volta, pra ver a emenda

    function quadro(nome, id) {
      var cel = document.createElement('div');
      cel.className = 'cel';
      var cv = document.createElement('canvas');
      cv.width = LARG * T * Z;
      cv.height = ALT * T * Z;
      var ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.setTransform(Z, 0, 0, Z, 0, 0);

      for (var r = 0; r < ALT; r++) {
        for (var c = 0; c < LARG; c++) window.Game.desenharPiso(ctx, c, r, T, 0);
      }

      // grade falsa: bloco 3x2 do tile no meio, com folga em volta
      var grade = [];
      for (r = 0; r < ALT + 2; r++) grade.push(new Array(LARG + 2).fill(0));
      for (r = 2; r <= 3; r++) for (c = 1; c <= 3; c++) grade[r][c] = id;

      ctx.save();
      ctx.translate(-T, -T);
      for (r = 0; r < ALT + 2; r++) {
        for (c = 0; c < LARG + 2; c++) {
          if (grade[r][c]) window.Game.desenharObjeto(ctx, c, r, grade[r][c], T, grade);
        }
      }
      ctx.restore();

      cel.appendChild(cv);
      var p = window.Sprites.CATALOGO[nome];
      cel.insertAdjacentHTML('beforeend',
        '<b>' + nome + '</b><span>' +
        (p.vazio ? '(pintado pelo vizinho)' :
          p.f.split('/').pop().replace('.png', '') + ' ' + p.c + ',' + p.r +
          ' ' + p.w + 'x' + p.h + (p.modo === 'alto' ? ' alto' : '')) +
        '</span>');
      return cel;
    }

    window.Sprites.aoCarregar(function () {
      var g = document.getElementById('grade');
      g.innerHTML = '';
      Object.keys(window.Sprites.CATALOGO).forEach(function (nome) {
        var id = M[nome];
        if (id === undefined) return;
        g.appendChild(quadro(nome, id));
      });
    });
  })();
  </script>
</body>
</html>
