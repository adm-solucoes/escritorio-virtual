<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pacote LPC - catalogo de folhas</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 20px; background: #eceaf6; color: #2c3240;
      font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 19px; }
    .aviso { margin: 0 0 18px; color: #666f80; font-size: 13px; max-width: 720px; }
    .peca {
      background: #fff; border-radius: 10px; padding: 10px 12px 12px;
      margin-bottom: 12px; box-shadow: 0 4px 14px rgba(30,34,48,.09);
    }
    .peca h2 { margin: 0; font-size: 14px; }
    .peca .meta { margin: 0 0 8px; font-size: 11.5px; color: #8a91a1; }
    .rolagem { overflow-x: auto; line-height: 0; }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h1>Pacote LPC &mdash; catalogo de folhas</h1>
  <p class="aviso">
    Cada folha em 3x, com a grade de 32px (= 1 tile do mapa) e o numero da
    coluna/linha. E daqui que saem as coordenadas em <code>js/sprites.js</code>.
  </p>
  <div id="lista"></div>

  <script>
  (function () {
    // Ordem de prioridade: primeiro os moveis que estao no mapa hoje.
    var FOLHAS = [
      'terrain/trees-summer.png',
      'terrain/rocks-grasslands.png',
      'terrain/plants-summer.png',
      'terrain/flowers.png',
      'structure-fences/ornamental-fence-a.png'
    ];

    var Z = 3, T = 32, MARGEM = 20;
    var lista = document.getElementById('lista');

    // Uma caixa por folha, criada JA na ordem: sem isso o onload embaralha tudo.
    FOLHAS.forEach(function (caminho) {
      var caixa = document.createElement('div');
      caixa.className = 'peca';
      lista.appendChild(caixa);

      var img = new Image();
      img.src = 'assets/lpc-moveis/' + caminho;
      img.onload = function () {
        var cols = img.width / T, rows = img.height / T;
        caixa.innerHTML =
          '<h2>' + caminho + '</h2>' +
          '<p class="meta">' + img.width + '&times;' + img.height + ' px = ' +
          cols + '&times;' + rows + ' tiles</p>';

        var rolagem = document.createElement('div');
        rolagem.className = 'rolagem';
        var cv = document.createElement('canvas');
        cv.width = img.width * Z + MARGEM;
        cv.height = img.height * Z + MARGEM;
        var ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        for (var yy = 0; yy < cv.height; yy += 8) {
          for (var xx = 0; xx < cv.width; xx += 8) {
            ctx.fillStyle = ((xx + yy) / 8) % 2 ? '#f2f3f7' : '#e6e8ef';
            ctx.fillRect(xx, yy, 8, 8);
          }
        }
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, cv.width, MARGEM);
        ctx.fillRect(0, 0, MARGEM, cv.height);
        ctx.drawImage(img, MARGEM, MARGEM, img.width * Z, img.height * Z);

        ctx.strokeStyle = 'rgba(91,69,200,.40)';
        ctx.lineWidth = 1;
        ctx.font = '10px Inter, system-ui, sans-serif';
        ctx.fillStyle = '#5b45c8';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (var c = 0; c <= cols; c++) {
          var px = MARGEM + c * T * Z + 0.5;
          ctx.beginPath(); ctx.moveTo(px, MARGEM); ctx.lineTo(px, cv.height); ctx.stroke();
          if (c < cols) ctx.fillText(c, MARGEM + (c + 0.5) * T * Z, MARGEM / 2 + 2);
        }
        for (var r = 0; r <= rows; r++) {
          var py = MARGEM + r * T * Z + 0.5;
          ctx.beginPath(); ctx.moveTo(MARGEM, py); ctx.lineTo(cv.width, py); ctx.stroke();
          if (r < rows) ctx.fillText(r, MARGEM / 2 + 2, MARGEM + (r + 0.5) * T * Z);
        }
        rolagem.appendChild(cv);
        caixa.appendChild(rolagem);
      };
      img.onerror = function () {
        caixa.innerHTML = '<h2>' + caminho + '</h2><p class="meta">NAO CARREGOU</p>';
      };
    });
  })();
  </script>
</body>
</html>
