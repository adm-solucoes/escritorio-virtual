# Deploy no Render. Importe como Blueprint e ele sobe com tudo configurado.
#
# Este arquivo esta no plano **free**: nao pede cartao, mas tem duas trocas que
# valem pra um teste e nao pra producao:
#
#   1. O servico DORME depois de ~15 min sem ninguem. A primeira visita depois
#      disso demora ~1 min pra acordar. Avise quem for testar.
#   2. NAO tem disco persistente: server/data/ some a cada restart ou deploy,
#      ou seja, **as contas e a decoracao do escritorio somem junto**. Pra um
#      teste tudo bem: e so cadastrar de novo.
#
# Pra guardar contas de verdade, troque `plan: free` por `plan: starter` e
# descomente o bloco `disk` no fim. Ver docs/deploy.md.
services:
  - type: web
    name: escritorio-virtual-adm
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    # Precisa responder 200 SEM login: /api/eu responde 401 de proposito.
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      # Codigo que a pessoa digita pra criar conta na sede.
      - key: CODIGO_SEDE
        generateValue: true
      # Codigo que marca a conta como diretoria (pode decorar o escritorio).
      - key: ADMIN_CODE
        generateValue: true
      # Sem isso, o segredo das sessoes seria sorteado a cada restart e todo
      # mundo cairia pra tela de login sem motivo.
      - key: SESSION_SECRET
        generateValue: true
      # SEM_LOGIN nao entra aqui de proposito: e so pra desenvolvimento, e o
      # codigo ja ignora a flag quando NODE_ENV=production.

    # Descomente junto com `plan: starter` pra as contas sobreviverem a deploys:
    # disk:
    #   name: dados
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
